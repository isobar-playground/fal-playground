# Local database for development — a plain Postgres plus an HTTP proxy that speaks
# the Neon serverless driver protocol, so the app code runs unchanged against it.
# Usage: docker compose up -d, then point DATABASE_URL in .env.local at
# postgres://postgres:postgres@db.localtest.me:5432/main (see README "Local database").
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 2s
      timeout: 3s
      retries: 15
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports:
      - "4444:4444"
    # The proxy seeds its neon_control_plane schema in Postgres on startup, so it
    # must not start before Postgres accepts connections.
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db_data:
